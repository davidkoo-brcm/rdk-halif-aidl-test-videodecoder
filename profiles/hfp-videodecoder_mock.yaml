# HAL Feature Profile for videodecoder (mock backend)
#
# Mirrors the mockservice's hardcoded getCapabilities() response
# (vts_hal_test_components/videodecoder/mockservice/src/VideoDecoder.cpp)
# so profile-declared capabilities match what the mock actually returns
# at runtime. Codec/enum names validated against the videodecoder 0.2.0.0
# interface pinned in rdk-halif-aidl/versions_released.yaml (== "current").
#
# supportedCodecs[].profiles is left empty: the mock never populates
# per-profile capability entries (CodecCapabilities.profiles) in its
# getCapabilities() implementation.
#
# supportedColorimetries: the mock never sets this either, but the HFP
# parser (vts_videodecoder_util.cpp) silently drops any decoder instance
# whose supportedColorimetries parses empty, so placeholder structured
# entries (per Colorimetry.aidl's documented "Common configurations") are
# declared here to keep both instances in the parsed set. These do not
# byte-match the mock's actual (empty) API response.

videodecoder:                   # Component object begins
  interfaceVersion: current
  supportedOperationalModes:
    - TUNNELLED
    - NON_TUNNELLED
  IVideoDecoder:                # Resource list
    - 0:                        # Resource object begins
      supportedCodecs:          # Array of CodecCapabilities
        # maxFrameHeight is 1088 (not 1080): coded height is padded up to the next
        # 16-pixel macroblock boundary, and 1080p test streams declare codedHeight=1088.
        - MPEG2_VIDEO:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - H264_AVC:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - H265_HEVC:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
        - VP9:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
        - AV1:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 3840
            maxFrameHeight: 2160
            supportedOutputPixelFormats:
              - YCBCR420
      supportedDynamicRanges:
        - SDR
        - HLG
        - HDR10
        - DOLBY_VISION
      supportedColorimetries:
        - BT601_525
        - BT601_625
        - BT709
        - BT2020
      supportsSecure: true
    - 1:                        # Resource object begins
      supportedCodecs:          # Array of CodecCapabilities
        # maxFrameHeight is 1088 (not 1080): coded height is padded up to the next
        # 16-pixel macroblock boundary, and 1080p test streams declare codedHeight=1088.
        - MPEG2_VIDEO:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - H264_AVC:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - H265_HEVC:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - VP9:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
        - AV1:
            profiles: []
            maxFrameRate: 60
            maxFrameWidth: 1920
            maxFrameHeight: 1088
            supportedOutputPixelFormats:
              - YCBCR420
      supportedDynamicRanges:
        - SDR
        - HLG
        - HDR10
        - HDR10_PLUS
        - DOLBY_VISION
      supportedColorimetries:
        - BT601_525
        - BT601_625
        - BT709
        - BT2020
      supportsSecure: true

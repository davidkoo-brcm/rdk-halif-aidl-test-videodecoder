    openWithResolutionHeight: -1
    # In-band resolution/bitrate ladder breakpoints: one entry per segment where the
    # bitstream's resolution changes (real, decoder-signalled changes via new SPS/
    # sequence headers, not simulated). Each entry's `pts` is the first frame's PTS
    # in that segment; the segment's expected width/height/bit_rate hold from that
    # PTS until the next entry's pts (or end of stream for the last one).
